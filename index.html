<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionRPA Agent</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1d2433;
    }

    .container {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 18px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      box-sizing: border-box;
      resize: vertical;
    }

    button {
      margin-top: 14px;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: #2563eb;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .output {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #eef4ff;
      border: 1px solid #c7d7fe;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel">
      <h1>VisionRPA Prompt Interface</h1>
      <p>Describe the work you want to automate in one prompt (for example shopping, sending email, scheduling, or repetitive computer tasks).</p>
      <form id="prompt-form">
        <label for="task-prompt">What should the agent do?</label>
        <textarea id="task-prompt" name="taskPrompt" placeholder="Example: Buy a black wireless mouse under $30 and email me the top 3 options."></textarea>
        <button type="submit">Automate from Prompt</button>
      </form>
      <div id="result" class="output" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('prompt-form');
    const promptInput = document.getElementById('task-prompt');
    const resultBox = document.getElementById('result');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const prompt = promptInput.value.trim();

      if (!prompt) {
        resultBox.style.display = 'block';
        resultBox.textContent = 'Please describe the task you want to automate.';
        return;
      }

      resultBox.style.display = 'block';
      resultBox.textContent = `Prompt received:\n"${prompt}"\n\nNext step: connect this UI to your backend agent to execute the automation.`;
    });
  </script>
</body>
</html>
